<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interbra &#x2764;</title>
    <!-- Enlace al CSS de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Enlace a Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="./Styles/style.css">
    <link rel="icon" type="image/x-icon" href="./Imagenes/interbralogo.jpg">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!-- Script de Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./scripts/Producto.js"></script>
</head>

<body>
    <div class="home">
        <a href="Index.html" class="text-decoration-none text-dark me-2">
            <i class="bi bi-house-door-fill" style="font-size: 1.5rem;"></i>
        </a>
    </div>
    <div class="galeria">
    </div>

    <div>
        <label for="sizeFilter">Talla:</label>
        <select id="sizeFilter" onchange="applyFilters()">
            <option value="">Seleccionar</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
        </select>
    
        <label for="resultLimit">Cantidad</label>
        <input type="number" id="resultLimit" min="1" max="100" onchange="applyFilters()" />
    
        <button onclick="applyFilters()">Aplicar Filtros</button>
    </div>
</body>
</html>
